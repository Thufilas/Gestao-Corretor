<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GestãoCorretor - CRM de Seguros Automotivos</title>
    <meta name="description" content="Sistema intuitivo e moderno de gestão (CRM) para corretores de seguros automotivos: controle de apólices, comissões, renovações, anexos e aniversariantes." />
    <meta property="og:title" content="GestãoCorretor - CRM de Seguros Automotivos" />
    <meta property="og:description" content="Sistema intuitivo e moderno de gestão (CRM) para corretores de seguros automotivos: controle de apólices, comissões, renovações, anexos e aniversariantes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('gestao_corretor_theme_v1');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] min-h-screen transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
